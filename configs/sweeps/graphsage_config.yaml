program: wandb_sweep_Karate_club_gnn.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --config=configs/config.yaml
  - --gnn_model_config=configs/gnn_model_config.yaml
  - --model_type=GraphSAGE
  - --wandb
  - --wandb_project=karate-club-gcn-sweep
  - --wandb_entity=kjsong
  # Assignments arrive through wandb.config; do not add ${args}.
method: bayes
metric:
  name: best_train_loss # val/score
  goal: minimize
parameters:
  wandb_project:
    value: karate-club-gcn-sweep
  models.GraphSAGE.num_layers:
    values: [2, 3, 4]
  models.GraphSAGE.hidden_channels:
    values: [4, 8, 16, 32, 64]
  models.GraphSAGE.aggr:
    values: ["mean", "sum", "std", "max", ["mean", "std"], ["mean", "sum"], ["mean", "sum", "std"]]
  models.GraphSAGE.dropout:
    distribution: uniform
    min: 0.0
    max: 0.3
  optimizer.Adam.lr:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 3.0e-3
  optimizer.Adam.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-2
  training.gradient_clip_val:
    distribution: uniform
    min: 0.5
    max: 2.0
early_terminate:
  type: hyperband
  min_iter: 500

---
logging_dir: "C:/Users/KETI/Desktop/KETI_kjsong/2.Code/KETI_AI_Tutorial/logs/"
checkpoint_dir: "C:/Users/KETI/Desktop/KETI_kjsong/2.Code/KETI_AI_Tutorial/checkpoints/"
optimizer:
  Adam:
    lr: 3e-3
    betas:
      - 0.9
      - 0.999
    eps: 1.0e-08
    weight_decay: 0.01
training:
  max_epochs: 500
  patience: 80
  max_global_samples: 2000000
  global_batch_size: 64
  score_alpha: 1.0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  accumulate_grad_batches: 1
  log_every_n_steps: 100
  log_every_n_samples: 0
  val_every_n_epochs: 0
  val_every_n_samples: 100000
  val_subset_samples: 0
  throughput_enabled: false
  log_normalized_violation: true
checkpointing:
  monitor: "best_train_loss"
  save_last: true
  every_n_epochs: 0
  every_n_samples: 0
